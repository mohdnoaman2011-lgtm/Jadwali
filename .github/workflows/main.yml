name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check files
        run: ls -R lib pubspec.yaml
      - name: Create android folder if missing
        run: '[ -d android ] || flutter create . --platforms=android --project-name jadwali'
      - name: Relax Kotlin JVM target validation
        run: echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jadwali-apk
          path: build/app/outputs/flutter-apk/app-release.apk