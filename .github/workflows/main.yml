name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo only needs lib/, assets/ and pubspec.yaml: the android/
      # project is generated here when it is missing.
      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name jadwali --org com.jadwali .
            rm -f test/widget_test.dart
          fi

      - name: Configure Android (notifications + desugaring)
        run: |
          python3 - <<'PY'
          import re, pathlib

          app = pathlib.Path('android/app')
          kts = app / 'build.gradle.kts'
          grv = app / 'build.gradle'

          if kts.exists():
              s = kts.read_text()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  s = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = maxOf(flutter.minSdkVersion, 24)', s)
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                  kts.write_text(s)
          elif grv.exists():
              s = grv.read_text()
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion Math.max(flutter.minSdkVersion, 24)', s)
                  s += '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
                  grv.write_text(s)

          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = manifest.read_text()
          if 'POST_NOTIFICATIONS' not in t:
              perms = (
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
                  '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
                  '    '
              )
              t = t.replace('<application', perms + '<application', 1)
              receivers = (
                  '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
                  '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
                  '    '
              )
              t = t.replace('</application>', receivers + '</application>', 1)
              manifest.write_text(t)
          print('Android configured')
          PY

      - name: Install packages
        run: flutter pub get

      - name: Analyze (does not block the build)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jadwali-apk
          path: build/app/outputs/flutter-apk/app-release.apk
